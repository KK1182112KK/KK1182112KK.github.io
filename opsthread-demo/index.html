<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>OpsThread Live Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=Geist:wght@400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
[hidden]{display:none!important}
:root{
  --bg:#0b0e10; --bg2:#0f1416; --panel:#141a1d; --panel2:#1a2226; --line:#2a3337; --line2:#3a4448;
  --fg:#e6ebea; --muted:#9aa5a9; --dim:#5f6a6e;
  --green:#3ddc84; --green-bg:#11241a; --on-green:#06140c; --yellow:#f2d533; --yellow-bg:#1f1c0c;
  --f:'Barlow',system-ui,sans-serif; --fc:'Barlow Semi Condensed','Barlow',sans-serif; --fm:'IBM Plex Mono',ui-monospace,monospace;
  --r-btn:12px; --r-card:14px; --r-pill:999px;
  --ease-out:cubic-bezier(.23,1,.32,1);
  /* springs: "stiffness damping" (designbookmark shared tokens; Kokonut values noted where used) */
  --spring-lead:620 36; --spring-settle:280 22; --spring-pop:520 16; --spring-fade:420 32;
  --hold-ms:1200; --hold-release:260 14; --hold-morph:320 20; --hold-done-ms:1700;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg);font-family:var(--f);-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh;background:radial-gradient(ellipse at 50% 40%,#121a1c 0%,var(--bg) 70%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input{font:inherit;color:inherit}
@media (prefers-reduced-motion:reduce){*{transition-duration:0s!important;animation-duration:0s!important}}

/* ---------- desktop stage ---------- */
.app{display:grid;grid-template-columns:auto 1fr auto;gap:28px;align-items:center;max-width:1440px;margin:0 auto;padding:24px 28px 30px;min-height:100vh;min-height:100dvh}
.phone{width:350px;height:min(760px,calc(100dvh - 60px));min-height:620px;border:2px solid var(--line2);border-radius:38px;background:var(--bg2);padding:14px 12px 12px;display:flex;flex-direction:column;position:relative;transition:border-color .3s,box-shadow .3s;overflow:hidden}
.phone.turn{border-color:var(--yellow);box-shadow:0 0 0 1px var(--yellow),0 0 40px rgba(242,213,51,.12)}
.ph-head{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:2px 6px 10px}
.ph-head .ot{color:var(--fg);font-weight:500}
.ph-head .role{display:flex;align-items:center;gap:4px;color:var(--fg)}
.ph-head .sp{flex:1}
.ph-head .clock{font-family:var(--fm)}
.ph-head .live{width:7px;height:7px;border-radius:50%;background:var(--green)}

.stage{display:flex;flex-direction:column;align-items:stretch;min-width:0;height:min(760px,calc(100dvh - 60px));min-height:620px}
.roles{display:flex;justify-content:space-between;align-items:flex-start;padding:0 6px}
.rl{display:flex;gap:12px;align-items:center}
.rl.r{flex-direction:row-reverse;text-align:right}
.rl svg{width:40px;height:40px;flex:none}
.rl b{display:block;font-size:20px;font-weight:600}
.rl span{display:block;font-size:14px;color:var(--muted)}
.rl.turn span{color:var(--yellow)}
.rl.turn svg *{stroke:var(--yellow)}
.center{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding:26px 10px 0}
.eyebrow{font-size:15px;color:var(--muted);margin-bottom:8px;min-height:20px}
.headline{font-family:var(--fc);font-weight:600;font-size:clamp(30px,3.2vw,46px);line-height:1.1;min-height:2.2em}
.headline .y{color:var(--yellow)}.headline .g{color:var(--green)}
.sub{font-size:17px;opacity:.85;margin-top:12px;min-height:24px}
/* step progress (designbookmark "Step progress", springs settle + pop) */
.flow{position:relative;margin:30px -28px 0;height:84px}
.flow .base,.flow .fbar{position:absolute;left:0;top:11px;height:3px}
.flow .base{right:0;background:var(--line2)}
.flow .fbar{width:100%;background:var(--green);transform-origin:0 50%;transform:scaleX(0)}
.nodes{position:relative;display:flex;justify-content:space-between;padding:0 6%}
.node{display:flex;flex-direction:column;align-items:center;gap:8px;width:90px;font-size:14px;color:var(--muted);line-height:1.15;transition:color .25s}
.node .vw{background:var(--bg);padding:0 2px;will-change:transform}
.node .vi{width:30px;height:24px;display:block}
.node.now{color:var(--yellow)}.node.ok{color:var(--fg)}
.narr{margin-top:22px;font-size:16px;min-height:22px}
.narr.y{color:var(--yellow)}
.dcs{margin:22px auto 0;width:300px;border:1px dashed var(--line2);border-radius:6px;padding:12px 14px;text-align:left;transition:border-color .3s}
.dcs.hot{border:2px solid var(--fg)}
.dcs .t{font-size:12px;font-weight:600}.dcs .t i{font-style:normal;font-weight:400;color:var(--muted)}
.dcs .tag{font-family:var(--fm);font-size:12px;color:var(--muted);margin-top:2px}.dcs .tag b{color:var(--fg);font-weight:500;margin-right:6px}
.dcs .row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:6px}
.dcs .val{font-family:var(--fm);font-size:34px;color:var(--yellow);letter-spacing:1px}
.dcs .val.zero{color:var(--green)}
.dcs .u{font-size:13px;color:var(--muted);margin-left:6px}
.dcs svg{width:96px;height:36px}
.foot{position:fixed;right:14px;bottom:8px;font-size:11px;color:var(--dim)}

/* ---------- segmented control (designbookmark, spring lead 620/36) ---------- */
.seg{position:relative;display:flex;background:var(--panel);border-radius:var(--r-pill);padding:3px;gap:0;isolation:isolate}
.seg .pill{position:absolute;top:3px;bottom:3px;left:0;border-radius:var(--r-pill);background:var(--fg);z-index:-1;will-change:transform,width}
.seg button{flex:1;position:relative;padding:5px 12px;border-radius:var(--r-pill);font-size:11.5px;font-weight:600;color:var(--muted);transition:color .2s;white-space:nowrap}
.seg button.on{color:var(--bg)}
.seg button .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--yellow);margin-left:5px;vertical-align:1px;opacity:0;transition:opacity .2s}
.seg button.turn .dot{opacity:1}
.seg.big{padding:4px;border:1px solid var(--line2);background:var(--bg2)}
.seg.big .pill{top:4px;bottom:4px;background:var(--panel2);box-shadow:inset 0 0 0 1.5px var(--fg)}
.seg.big button{text-align:left;padding:7px 12px;border-radius:12px}
.seg.big button,.seg.big button.on{color:var(--fg)}
.seg.big .pill{border-radius:12px}
.seg.big button b{display:block;font-size:14px}
.seg.big button span{display:block;font-size:11.5px;font-weight:500;color:var(--muted)}
.seg.big button.turn span{color:var(--yellow)}

/* ---------- control room phone ---------- */
.card{border:2px solid var(--line2);border-radius:var(--r-card);padding:12px 14px;background:var(--panel);min-height:96px;transition:border-color .3s}
.card.act{border-color:var(--fg)}
.card .top{display:flex;justify-content:space-between;align-items:flex-start}
.card .verb{font-family:var(--fc);font-weight:700;font-size:34px;letter-spacing:1px;line-height:1}
.card .eq{text-align:right;font-family:var(--fm);font-size:24px;line-height:1}
.card .eq small{display:block;font-size:9px;color:var(--muted);letter-spacing:1px;margin-top:3px}
.card .unit{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--muted)}
.card .unit .q{display:inline-grid;place-items:center;width:26px;height:24px;border:1.5px solid var(--yellow);border-radius:4px;color:var(--yellow);font-weight:700;font-size:15px}
.card .unit .v{color:var(--green);font-size:17px;font-weight:600}
.card.dim .verb,.card.dim .eq{color:var(--muted)}
.skel{height:12px;border-radius:4px;background:var(--panel2);margin:10px 0}
.steps{flex:1;overflow:auto;margin-top:10px;border-radius:var(--r-card);padding:4px 2px;-webkit-overflow-scrolling:touch}
.steps.box{border:2px solid var(--line2);background:var(--bg2)}
.st{display:flex;align-items:center;gap:8px;padding:9px 8px;font-size:13px;color:var(--muted)}
.st .vi{width:20px;height:16px;flex:none}
.st .tx{flex:1;min-width:0}
.st .meta{font-size:11px;color:var(--muted);display:flex;gap:4px;align-items:center;font-family:var(--fm)}
.st.ok .meta{color:var(--green)}
.st.now{color:var(--yellow);font-size:15px;font-weight:600}
.st.now .meta{color:var(--yellow)}
.ask{margin:2px 6px 8px;border:1.5px solid var(--yellow);border-radius:10px;background:var(--yellow-bg);padding:10px}
.ask .q{font-size:13px;color:var(--yellow);font-weight:600}.ask .q b{color:var(--fg)}
.ask .opts{display:flex;gap:8px;margin:8px 0}
.ask .opts button{flex:1;padding:11px 0;border-radius:8px;background:#0d1012;font-weight:600;font-size:14px;border:1px solid var(--line2)}
.ask .opts button:active{background:var(--panel2)}
.ask .h{font-size:10.5px;color:var(--muted)}.ask .h2{font-size:11px;color:var(--yellow);margin-top:2px}
/* task list (SmoothUI AI task list) */
.tl{padding:8px 10px}
.tl .hd{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.tl .hd b{color:var(--fg);font-weight:600}
.tl .hd span{font-family:var(--fm)}
.tl .row{display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:13.5px;position:relative;transition:opacity .25s cubic-bezier(.645,.045,.355,1),transform .25s cubic-bezier(.645,.045,.355,1)}
.tl .row.done{opacity:.65;transform:translateY(1px)}
.tl .box{width:14px;height:14px;flex:none;margin-top:2px}
.tl .box rect{transition:fill-opacity .2s,stroke .2s}
.tl .box path{stroke-dasharray:12;stroke-dashoffset:12;transition:stroke-dashoffset .3s cubic-bezier(.645,.045,.355,1)}
.tl .row.done .box path{stroke-dashoffset:0}
.tl .tx{position:relative;display:inline-block}
.tl .row.run .tx::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1.5px;background:linear-gradient(90deg,transparent,var(--green),transparent);background-size:50% 100%;background-repeat:no-repeat;opacity:.5;animation:under 1.4s cubic-bezier(.645,.045,.355,1) infinite}
@keyframes under{from{background-position:-100% 0}to{background-position:200% 0}}
.tl .sub2{font-size:11.5px;color:var(--muted);margin-left:22px;margin-top:-2px}
/* voice dock */
.dock{margin-top:8px;border:2px solid var(--line2);border-radius:var(--r-card);padding:10px;text-align:center;background:var(--bg2)}
.dock .cap{font-family:var(--fm);font-size:11px;color:var(--muted)}
.dock .typ{display:flex;gap:6px;margin:8px auto 0;max-width:250px}
.dock input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:7px 9px;font-size:16px;text-align:center}
.dock input::placeholder{color:var(--dim);font-size:13px}
.dock .go{padding:0 10px;border-radius:6px;background:var(--panel2);border:1px solid var(--line2);font-size:13px}
.mic{width:52px;height:52px;border-radius:50%;border:2px solid var(--green);background:var(--green-bg);display:grid;place-items:center;margin:10px auto 2px}
.mic svg{width:22px;height:22px}
.said{font-size:19px;font-weight:600;text-decoration:underline;text-decoration-color:var(--green);text-underline-offset:4px;min-height:26px;margin-top:2px;word-break:break-word}
.lvl{display:flex;gap:3px;justify-content:center;margin:6px 0 8px;height:16px;align-items:center}
.lvl i{width:3px;height:4px;background:var(--green);border-radius:1px;transition:height .1s}
.listen{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--green);border:1px solid var(--green);border-radius:99px;padding:6px 14px;background:var(--green-bg)}
.listen::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.tip{font-size:11px;color:var(--muted);margin-top:6px}
.miss{font-size:11.5px;color:var(--yellow);margin-top:4px;min-height:14px}
.hint{font-size:12px;color:var(--muted);text-align:center;margin:8px 0 6px;min-height:15px}
.act{min-height:56px}
.bigbtn{display:block;width:100%;height:56px;border-radius:var(--r-btn);font-size:16px;font-weight:600;background:var(--panel);color:var(--dim);border:1px solid var(--line)}
.bigbtn.ghost{background:var(--panel2);color:var(--fg);border-color:var(--line2)}
.bigbtn.out{background:var(--green-bg);color:var(--green);border-color:var(--green)}
.bigbtn.go{background:var(--green);color:var(--on-green);border-color:var(--green)}

/* slide to confirm (Kokonut UI) */
.slide{position:relative;height:56px;border-radius:var(--r-btn);background:var(--panel2);border:1px solid var(--line2);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.slide .lab{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:600;color:var(--muted);pointer-events:none;padding-left:44px}
.slide .shine{background:linear-gradient(90deg,var(--muted) 0%,var(--fg) 50%,var(--muted) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 2.4s linear infinite}
@keyframes shine{from{background-position:100% 0}to{background-position:-100% 0}}
.slide .fill{position:absolute;inset:0;background:var(--green);pointer-events:none}
.slide .fl{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:700;color:var(--on-green);pointer-events:none}
.slide .fl span{transition:opacity .26s var(--ease-out),transform .26s var(--ease-out),filter .26s var(--ease-out)}
.slide .thumb{position:absolute;top:4px;left:4px;width:48px;height:46px;border-radius:9px;background:var(--fg);color:var(--bg);display:grid;place-items:center;cursor:grab;touch-action:none;will-change:transform}
.slide .thumb:active{cursor:grabbing}
.slide .thumb svg{position:absolute;width:20px;height:20px;transition:opacity .2s,transform .2s,filter .2s}
.slide .ic-check{opacity:0;transform:scale(.5);color:#15803d}
.slide .spin{opacity:0;border:2px solid rgba(11,14,16,.25);border-top-color:var(--bg);border-radius:50%;width:20px;height:20px;position:absolute;animation:spin .7s linear infinite;animation-play-state:paused;transition:opacity .2s}
.slide.busy .ic-arrow,.slide.done .ic-arrow{opacity:0;transform:translateX(6px);filter:blur(2px)}
.slide.busy .spin{opacity:1;animation-play-state:running;transition-delay:.1s}
.slide.done .ic-check{opacity:1;transform:scale(1)}
@keyframes spin{to{transform:rotate(360deg)}}
.slide.off{opacity:.5;pointer-events:none}

/* hold button (Kokonut UI) */
.hold{position:relative;display:block;width:100%;height:58px;border-radius:var(--r-card);background:var(--green);color:var(--on-green);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;transition:background-color .15s,color .15s}
.hold .fillh{position:absolute;inset:0;background:rgba(6,20,12,.28);transform-origin:0 50%;transform:scaleX(0);pointer-events:none}
.hold .in{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;pointer-events:none}
.hold b{font-family:var(--fc);font-size:28px;font-weight:700;letter-spacing:1px;line-height:1;display:flex;align-items:center;gap:8px}
.hold span{font-size:12px;font-weight:500}
.hold .lbl{transition:opacity .2s var(--ease-out),transform .2s var(--ease-out),filter .2s var(--ease-out)}
.hold .lbl.swap{opacity:0;transform:translateY(-6px);filter:blur(2px)}
.hold svg.ck{width:22px;height:22px}
.hold svg.ck path{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s var(--ease-out) .1s}
.hold.complete svg.ck path{stroke-dashoffset:0}
.hold.complete{background:#2fbf70}

/* hold to publish (designbookmark: hold-ms 1200, release 260/14, morph 320/20, done 1700ms) */
.htp{position:relative;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:var(--r-btn);background:var(--green);color:var(--on-green);font-weight:600;font-size:15.5px;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;will-change:width,border-radius}
.htp .ring{width:24px;height:24px;flex:none}
.htp .ring circle.p{transition:none}
.htp .t{white-space:nowrap}
.htp.off{background:var(--panel);color:var(--dim)}
.htp.off .ring circle{stroke:var(--dim)}

/* loading to success (designbookmark: settle 280/22 + pop 520/16) */
.ls{position:relative;margin:0 auto;height:58px;border-radius:var(--r-card);background:var(--panel2);border:1.5px solid var(--yellow);color:var(--yellow);display:flex;align-items:center;justify-content:center;gap:10px;font-weight:600;font-size:15px;overflow:hidden;will-change:width}
.ls .sp{width:20px;height:20px;border:2px solid rgba(242,213,51,.25);border-top-color:var(--yellow);border-radius:50%;animation:spin .7s linear infinite;flex:none}
.ls .ok{width:22px;height:22px;flex:none;will-change:transform}
.ls .t{white-space:nowrap}

/* handover */
.ho h3{font-family:var(--fc);font-size:22px;font-weight:700;padding:4px 4px 8px}.ho h3 small{font-family:var(--f);font-size:12px;font-weight:400;color:var(--muted);margin-left:6px}
.hob{border-radius:10px;padding:10px;margin-bottom:8px;background:var(--panel);border:1px solid var(--line)}
.hob.open{border:1.5px solid var(--yellow);background:var(--yellow-bg)}
.hob .k{font-size:10.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.hob.open .k{color:var(--yellow)}.hob.cl .k{color:var(--green)}
.hob .it{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;margin-top:4px}
.hob .it .vi{width:18px;height:14px;flex:none;margin-top:2px}
.hob .sm{font-family:var(--fm);font-size:10.5px;color:var(--muted);margin:2px 0 0 26px}
.hob.open .sm{color:var(--yellow)}.hob.cl .sm{color:var(--green);opacity:.85}

/* ---------- field phone ---------- */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);padding:26px 0 14px}
.empty b{font-family:var(--fm);font-size:40px;color:var(--green);font-weight:500;line-height:1}
.empty span{font-size:13px}.empty em{font-style:normal;font-size:13px;margin-top:2px;font-weight:600;color:var(--fg)}
/* notification stack (Kokonut UI: PEEK 10, scale .05/step, GAP 8, 300ms ease-out, snap spring 520 critical) */
.ns{position:relative;transition:height .3s var(--ease-out);margin:4px 2px 0}
.ns .nc{position:absolute;left:0;right:0;top:0;transform-origin:50% 0;transition:transform .3s var(--ease-out),opacity .3s var(--ease-out);touch-action:pan-y;user-select:none;-webkit-user-select:none}
.ns .nc.drag{transition:opacity .3s var(--ease-out)}
.ncard{display:flex;gap:10px;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r-card);padding:10px 12px;cursor:pointer}
.ncard.new{border-color:var(--yellow);background:#191a10}
.ncard .ic{width:30px;height:30px;border-radius:8px;background:var(--panel2);display:grid;place-items:center;flex:none}
.ncard.new .ic{background:var(--yellow);color:#14130a}
.ncard .bd{flex:1;min-width:0}
.ncard .r1{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.ncard .r1 b{color:var(--fg);font-weight:600}
.ncard.new .r1 b{color:var(--yellow)}
.ncard .ti{font-size:14px;font-weight:600;margin-top:1px}
.ncard .bo{font-size:12px;color:var(--muted);margin-top:1px;line-height:1.3}
.ns-hint{font-size:11px;color:var(--dim);text-align:center;margin-top:8px;min-height:14px}
.freq{border:2px solid var(--fg);border-radius:var(--r-card);padding:10px 12px;background:var(--panel)}
.freq.dim{border-color:var(--line2)}
.freq .from{font-size:11px;color:var(--yellow)}
.freq.dim .from{color:var(--muted)}
.freq .u{font-family:var(--fc);font-weight:700;font-size:44px;line-height:1.02;letter-spacing:1px}
.freq .a{font-family:var(--fc);font-weight:700;font-size:28px;line-height:1}
.freq .a span{font-family:var(--fm);font-weight:500}
.freq .a small{font-size:11px;font-family:var(--fm);margin-left:6px}
.freq .chk{font-size:12px;color:var(--yellow);font-weight:600;margin-top:5px}
.freq.dim .u,.freq.dim .a{color:#c5cdcb}
.chip{border-radius:var(--r-card);padding:12px;border:2px solid var(--yellow);background:var(--yellow-bg)}
.chip .lab{display:flex;justify-content:space-between;align-items:center}
.chip .lab b{background:var(--yellow);color:#14130a;border-radius:99px;padding:3px 10px;font-size:13px;font-weight:700;letter-spacing:.5px}
.chip .lab span{font-family:var(--fm);font-size:12px;color:var(--yellow)}

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var mobile=function(){return window.matchMedia('(max-width:999px)').matches};
var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= spring engine (one rAF loop, 4 substeps, like designbookmark motion.js) ================= */
var Motion=(function(){
  var css=getComputedStyle(document.documentElement);
  function pair(name){var v=css.getPropertyValue(name).trim().split(/\s+/).map(Number);return {k:v[0],c:v[1]}}
  function num(name){return parseFloat(css.getPropertyValue(name))}
  var items=new Set(),last=0,running=false;
  function S(x,p){p=p||{k:620,c:36};if(reduce)p={k:p.k,c:2*Math.sqrt(p.k)};return {x:x,v:0,t:x,k:p.k,c:p.c,rest:true}}
  function to(s,t,p,v){s.t=t;if(p){s.k=p.k;s.c=reduce?2*Math.sqrt(p.k):p.c}if(v!==undefined)s.v=v;s.rest=false;kick()}
  function step(s,dt){if(s.rest)return;var a=-s.k*(s.x-s.t)-s.c*s.v;s.v+=a*dt;s.x+=s.v*dt;if(Math.abs(s.v)<.01&&Math.abs(s.x-s.t)<.005){s.x=s.t;s.v=0;s.rest=true}}

  function kick(){if(!running){running=true;last=performance.now();requestAnimationFrame(loop)}}
  function loop(now){var dt=Math.min(.064,(now-last)/1000);last=now;var any=false;
    items.forEach(function(fn){if(fn(dt/4,4))any=true});
    if(any)requestAnimationFrame(loop);else running=false}
  return {S:S,to:to,step:step,add:add,kick:kick,pair:pair,num:num};
})();
// helper: run springs through registered updaters (fn returns true while moving)
function animator(springs,render){
  return Motion.add(function(dt,n){var moving=false;for(var i=0;i<n;i++)springs.forEach(function(s){Motion.step(s,dt)});springs.forEach(function(s){if(!s.rest)moving=true});render();return moving});
}
function tween(dur,ease,cb,done){var t0=performance.now();function f(now){var p=Math.min(1,(now-t0)/dur);cb(ease?ease(p):p);if(p<1)requestAnimationFrame(f);else done&&done()}requestAnimationFrame(f)}
function bez(x1,y1,x2,y2){return function(t){var lo=0,hi=1,m;for(var i=0;i<24;i++){m=(lo+hi)/2;var x=3*(1-m)*(1-m)*m*x1+3*(1-m)*m*m*x2+m*m*m;if(x<t)lo=m;else hi=m}return 3*(1-m)*(1-m)*m*y1+3*(1-m)*m*m*y2+m*m*m}}
var EASE_OUT=bez(.23,1,.32,1),EASE_IN_OUT=bez(.65,0,.35,1);

/* ================= Segmented control ================= */
function Segmented(el,items,onPick,big){
  el.innerHTML='<div class="pill"></div>'+items.map(function(it){return '<button type="button" data-k="'+it.k+'">'+(big?'<b>'+it.label+'</b><span></span>':it.label+'<i class="dot"></i>')+'</button>'}).join('');
  var pill=el.querySelector('.pill'),btns=[].slice.call(el.querySelectorAll('button'));
  var sx=Motion.S(0,Motion.pair('--spring-lead')),sw=Motion.S(0,Motion.pair('--spring-lead')),cur=null,first=true;
  animator([sx,sw],function(){pill.style.transform='translateX('+sx.x+'px)';pill.style.width=sw.x+'px'});
  function place(k,jump){var b=btns.filter(function(x){return x.dataset.k===k})[0];if(!b)return;var x=b.offsetLeft,w=b.offsetWidth;
    if(jump||first||!w){sx.x=sx.t=x;sw.x=sw.t=w;sx.rest=sw.rest=false;Motion.kick();first=!w}else{Motion.to(sx,x);Motion.to(sw,w)}}
  btns.forEach(function(b){b.addEventListener('click',function(){onPick(b.dataset.k)})});
  return {set:function(k,jump){cur=k;btns.forEach(function(b){b.classList.toggle('on',b.dataset.k===k)});place(k,jump)},
    status:function(k,txt,turn){var b=btns.filter(function(x){return x.dataset.k===k})[0];if(!b)return;b.classList.toggle('turn',!!turn);var s=b.querySelector('span');if(s)s.textContent=txt},
    relayout:function(){if(cur)place(cur,true)}};
}

/* ================= Slide to confirm (Kokonut UI values) ================= */
function SlideToConfirm(host,o){
  var HEIGHT=56,INSET=4,THUMB=48,COMMIT_AT=.9,FLICK_SPEED=900,FLICK_FROM=.45,OVERDRAG=8;
  host.innerHTML='<div class="slide" role="slider" aria-label="'+o.label+'"><div class="lab"><span class="shine">'+o.label+'</span></div><div class="fill"><div class="fl"><span>'+o.busyLabel+'</span></div></div><div class="thumb"><svg class="ic-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg><span class="spin"></span><svg class="ic-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div></div>';
  var root=host.firstChild,thumb=root.querySelector('.thumb'),fill=root.querySelector('.fill'),lab=root.querySelector('.lab'),fl=root.querySelector('.fl span');
  var sx=Motion.S(0,{k:520,c:42}),state='idle',max=function(){return root.clientWidth-INSET*2-THUMB};
  function paint(){var m=max(),x=sx.x,p=m>0?Math.max(0,x)/m:0;thumb.style.transform='translateX('+x+'px)';fill.style.clipPath='inset(0 '+(root.clientWidth-(x+INSET+THUMB))+'px 0 0 round 11px)';fill.style.opacity=Math.min(1,p*1.6);lab.style.opacity=Math.max(0,1-p*1.4)}
  animator([sx],paint);paint();
  function band(raw,m){if(raw<0)return 0;if(raw<=m)return raw;var over=raw-m;return m+OVERDRAG*(1-Math.exp(-over/OVERDRAG/2))}
  var drag=null;
  thumb.addEventListener('pointerdown',function(e){if(state!=='idle'||root.classList.contains('off'))return;thumb.setPointerCapture(e.pointerId);drag={x0:e.clientX-sx.x,samples:[]};sx.rest=true});
  thumb.addEventListener('pointermove',function(e){if(!drag)return;var raw=e.clientX-drag.x0;sx.x=sx.t=band(raw,max());drag.samples.push({t:e.timeStamp,x:sx.x});if(drag.samples.length>6)drag.samples.shift();paint()});
  function up(){if(!drag)return;var s=drag.samples,v=0;if(s.length>1){var a=s[0],b=s[s.length-1];v=(b.x-a.x)/Math.max(1,b.t-a.t)*1000}drag=null;var p=sx.x/max();
    if(p>=COMMIT_AT||(v>FLICK_SPEED&&p>FLICK_FROM))commit(v);else{Motion.to(sx,0,{k:520,c:42},v)}}
  thumb.addEventListener('pointerup',up);thumb.addEventListener('pointercancel',up);
  function commit(v,glide){if(state!=='idle')return;state='busy';
    if(glide){var x0=sx.x,m=max();tween(reduce?0:420,EASE_IN_OUT,function(p){sx.x=sx.t=x0+(m-x0)*p;paint()})}else Motion.to(sx,max(),{k:520,c:42},v||0);
    root.classList.add('busy');fl.textContent=o.busyLabel;
    Promise.resolve(o.onConfirm&&o.onConfirm()).then(function(){state='done';root.classList.remove('busy');root.classList.add('done');swap(fl,o.doneLabel);o.onDone&&o.onDone()},function(){state='idle';root.classList.remove('busy');Motion.to(sx,0)})}
  function swap(el,txt){el.style.opacity=0;el.style.transform='translateY(-8px)';el.style.filter='blur(2px)';setTimeout(function(){el.textContent=txt;el.style.transition='none';el.style.transform='translateY(8px)';void el.offsetWidth;el.style.transition='';el.style.opacity=1;el.style.transform='translateY(0)';el.style.filter='blur(0)'},130)}
  // keyboard: Enter / Space confirms
  thumb.tabIndex=0;thumb.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();commit(0,true)}});
  return {confirm:function(){commit(0,true)},setDisabled:function(d){root.classList.toggle('off',d)},get state(){return state}};
}

/* ================= Hold button (Kokonut UI: hold 1200ms linear, drain progress*300ms ease-out, check draws 0.3s) ================= */
function HoldButton(host,o){
  var DRAIN_MS=300,HOLD=o.holdMs||1200;
  host.innerHTML='<button type="button" class="hold"><span class="fillh"></span><span class="in"><b class="lbl">'+o.title+'</b><span class="lbl sub">'+o.label+'</span></span></button>';
  var b=host.firstChild,fillEl=b.querySelector('.fillh'),title=b.querySelector('b'),sub=b.querySelector('.sub');
  var p=0,raf=0,mode='idle',done=false;
  function set(v){p=v;fillEl.style.transform='scaleX('+p+')'}
  function stop(){cancelAnimationFrame(raf)}
  function swapText(el,txt){el.classList.add('swap');setTimeout(function(){el.textContent=txt;el.classList.remove('swap')},150)}
  function fill(){stop();mode='hold';swapText(sub,o.holdingLabel||'Keep holding');var from=p,t0=performance.now(),rem=(1-from)*HOLD;
    (function f(now){var q=Math.min(1,from+(now-t0)/HOLD);set(q);if(q<1)raf=requestAnimationFrame(f);else complete()})(t0)}
  function drain(){if(mode!=='hold')return;stop();mode='idle';swapText(sub,o.label);var from=p,dur=reduce?0:from*DRAIN_MS;tween(dur,EASE_OUT,function(q){if(mode==='idle')set(from*(1-q))})}
  function complete(){if(done)return;done=true;mode='done';set(1);b.classList.add('complete');title.innerHTML=(o.doneTitle||'DONE')+'<svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';swapText(sub,o.completeLabel||'Done');setTimeout(function(){o.onComplete&&o.onComplete()},o.afterMs||450)}
  b.addEventListener('pointerdown',function(e){if(done)return;e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}fill()});
  b.addEventListener('pointerup',drain);b.addEventListener('pointercancel',drain);b.addEventListener('lostpointercapture',drain);
  b.addEventListener('keydown',function(e){if((e.key===' '||e.key==='Enter')&&!e.repeat&&!done){e.preventDefault();fill()}});
  b.addEventListener('keyup',function(e){if(e.key===' '||e.key==='Enter')drain()});
  b.addEventListener('click',function(){if(!done&&mode!=='hold'&&p<.02)toast(o.tapHint||'Press and hold.')});
  b.addEventListener('contextmenu',function(e){e.preventDefault()});
  return {complete:complete,el:b};
}

/* ================= Hold to publish (designbookmark tokens: hold-ms, hold-release, hold-morph, hold-done-ms) ================= */
function HoldToPublish(host,o){
  var HOLD=Motion.num('--hold-ms'),REL=Motion.pair('--hold-release'),MORPH=Motion.pair('--hold-morph'),DONE_MS=Motion.num('--hold-done-ms');
  var R=10,C=2*Math.PI*R;
  host.innerHTML='<button type="button" class="htp"><svg class="ring" viewBox="0 0 24 24"><circle cx="12" cy="12" r="'+R+'" fill="none" stroke="rgba(6,20,12,.25)" stroke-width="2.5"/><circle class="p" cx="12" cy="12" r="'+R+'" fill="none" stroke="#06140c" stroke-width="2.5" stroke-linecap="round" transform="rotate(-90 12 12)" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'"/><path class="ck" d="M7.5 12.5l3 3 6-6.5" fill="none" stroke="#06140c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="16" stroke-dashoffset="16"/></svg><span class="t">'+o.label+'</span></button>';
  var b=host.firstChild,pc=b.querySelector('circle.p'),ck=b.querySelector('path.ck'),t=b.querySelector('.t');
  var sp=Motion.S(0,REL),sw=Motion.S(1,MORPH),sc=Motion.S(1,Motion.pair('--spring-pop')),holding=false,done=false,t0=0,raf=0,disabled=false;
  function paint(){pc.setAttribute('stroke-dashoffset',C*(1-Math.max(0,Math.min(1,sp.x))));b.style.width=(sw.x*100)+'%';b.style.transform='scale('+sc.x+')'}
  animator([sp,sw,sc],paint);paint();
  function down(e){if(done||disabled){if(disabled)o.onBlocked&&o.onBlocked();return}e&&e.preventDefault();if(e)try{b.setPointerCapture(e.pointerId)}catch(_){}
    holding=true;sp.rest=true;var from=Math.max(0,sp.x);t0=performance.now()-from*HOLD;Motion.to(sc,.97);t.textContent=o.holdingLabel;
    (function f(now){if(!holding)return;var q=Math.min(1,(now-t0)/HOLD);sp.x=sp.t=q;paint();if(q<1)raf=requestAnimationFrame(f);else finish()})(performance.now())}
  function up(){if(!holding)return;holding=false;cancelAnimationFrame(raf);if(done)return;Motion.to(sp,0,REL);Motion.to(sc,1);t.textContent=o.label}
  function finish(){if(done)return;done=true;holding=false;sp.x=sp.t=1;Motion.to(sc,1);Motion.to(sw,.62,MORPH);ck.style.transition='stroke-dashoffset .3s cubic-bezier(.23,1,.32,1) .1s';ck.setAttribute('stroke-dashoffset','0');pc.style.opacity=0;t.textContent=o.doneLabel;setTimeout(function(){o.onComplete&&o.onComplete()},Math.min(DONE_MS,600))}
  b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up);
  b.addEventListener('keydown',function(e){if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();down()}});b.addEventListener('keyup',function(e){if(e.key===' '||e.key==='Enter')up()});
  b.addEventListener('contextmenu',function(e){e.preventDefault()});
  return {complete:function(){if(done)return;holding=true;sp.rest=true;var t1=performance.now(),from=sp.x;(function f(now){var q=Math.min(1,from+(now-t1)/450);sp.x=sp.t=q;paint();if(q<1)requestAnimationFrame(f);else finish()})(t1)},
    setDisabled:function(d,label){disabled=d;b.classList.toggle('off',d);if(!holding&&!done)t.textContent=d&&label?label:o.label}};
}

/* ================= Loading to success (designbookmark: settle 280/22 width, pop 520/16 check) ================= */
function LoadingSuccess(host,o){
  host.innerHTML='<div class="ls"><span class="sp"></span><svg class="ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span class="t">'+o.loading+'</span></div>';
  var el=host.firstChild,sp=el.querySelector('.sp'),ok=el.querySelector('.ok'),t=el.querySelector('.t');
  var sw=Motion.S(100,Motion.pair('--spring-settle')),sc=Motion.S(0,Motion.pair('--spring-pop'));
  animator([sw,sc],function(){el.style.width=sw.x+'%';ok.style.transform='scale('+Math.max(0,sc.x)+')'});
  Motion.to(sw,72);
  setTimeout(function(){sp.style.display='none';ok.style.display='';t.textContent=o.done;Motion.to(sw,100);Motion.to(sc,1);setTimeout(function(){o.onDone&&o.onDone()},650)},o.ms||800);
}

/* ================= Notification stack (Kokonut UI values) ================= */
function NotificationStack(host,items,o){
  var PEEK=10,VISIBLE_BEHIND=2,GAP=8,DISMISS_DISTANCE=100,DISMISS_VELOCITY=.11,K=520,CD=2*Math.sqrt(520);
  host.innerHTML='<div class="ns"></div><div class="ns-hint">'+(o.hint||'')+'</div>';
  var wrap=host.firstChild,list=items.slice(),expanded=false,nodes={};
  function cardHTML(n){return '<div class="ncard'+(n.isNew?' new':'')+'"><div class="ic">'+(n.icon||'')+'</div><div class="bd"><div class="r1"><b>'+n.app+'</b><span>'+n.time+'</span></div><div class="ti">'+n.title+'</div><div class="bo">'+n.body+'</div></div></div>'}

  render();
  var c=copy();
  if(mobile()&&c.turn&&c.turn!==S.view)setTimeout(function(){setView(c.turn,c.turn==='fd'?'Field’s turn: a request just landed.':'Control room’s turn.')},700);
}
function heardStop(){if(S.stage!==0||S.busy)return;S.busy=true;render();
  TaskList($('crSteps'),'OpsThread is building the request',[{label:'Heard “Stop P-1.”',ms:300},{label:'Action: Stop',ms:260},{label:'Equipment: P-1 (pump)',ms:300},{label:'Checked the equipment list',sub:'2 matches: Unit A and Unit B. Ask which.',ms:520}],function(){S.busy=false;go(1)});
  $('crSteps').className='steps box';
}
function pickUnit(u){if(S.stage!==1)return;S.unit=u;go(2)}
function send(){if(S.stage!==2||!slider)return;slider.confirm()}
function closeReq(){if(S.stage!==5)return false;if(S.flow>.5){var m=tag()+' still reads '+S.flow.toFixed(1)+'. Close it on 0.';$('miss').textContent=m;toast(m);return false}if(closer)closer.complete();return true}
function reset(){stopListen();var v=S.view;S=fresh();S.view=mobile()?'cr':v;crActFor=-1;fdTopFor=null;fdActFor=null;prevNode=[];render();setView(S.view)}

/* ================= understanding speech / typing =================
   Only the words this step expects are accepted (the demo knows what comes next), and common
   mishearings are mapped back: "stop pee won", "unit bee/v/d", "sand", "clothes"... */
function norm(t){return ' '+t.toLowerCase().replace(/[“”"'.,!?:;]/g,' ').replace(/-/g,' ').replace(/(\d)/g,' $1 ').replace(/\s+/g,' ').trim()+' '}
var W={
  stop:/ (stop|stops|stopped|stopping|stap|stob|top|stuff|stomp|shop|start p) /,
  p1:/ (p ?1|p one|pee ?(1|one|won)|pea ?(1|one|won)|pe ?(1|one)|pete ?(1|one)|key ?(1|one)|tea ?(1|one)|be ?(1|one)|people|pay ?(1|one)|pin|pee|p) /,
  unitWord:/ (unit|units|you need|you knit|unite|you nit|unity|you ate|human|eunice|in it) /,
  b:/ (b|bee|be|beat|bea|bean|beam|bead|v|vee|d|dee|e|bravo|the|me|we) /,
  a:/ (a|ay|aye|eh|hey|8|eight|alpha|ate|age|ace) /,
  bAlone:/^ (b|bee|be|bravo|v|vee) $/, aAlone:/^ (a|ay|eh|hey|8|eight|alpha) $/,
  send:/ (send|sends|sent|sending|sand|sen|cent|scent|send it|sent it|go ahead|go|ok send|okay send|yes send|confirm) /,
  close:/ (zero|0|0 0|o|oh|close|closed|closing|clothes|clause|confirmed|confirm|reads 0|reads zero|flows zero|flow zero|no flow) /
};
function intent(t){
  if(S.stage===0&&!S.busy){if(W.stop.test(t)&&(W.p1.test(t)||/ (1|one|won) /.test(t)))return 'stop';if(/^ (stop|stop it|stop the pump|stop pump 1|stop pump one) $/.test(t))return 'stop';return null}
  if(S.stage===1){
    var m=t.match(/ (unit|units|you need|you knit|unite|you nit|unity|human|eunice|in it) (\S+) /);
    if(m){var w=' '+m[2]+' ';if(W.b.test(w))return 'B';if(W.a.test(w))return 'A'}
    if(W.bAlone.test(t)||/ bravo /.test(t)||/ unit ?b /.test(t))return 'B';
    if(W.aAlone.test(t)||/ alpha /.test(t)||/ unit ?a /.test(t))return 'A';
    if(/ (unity|unit be|unit bee) /.test(t))return 'B';
    return null}
  if(S.stage===2)return W.send.test(t)?'send':null;
  if(S.stage===5)return W.close.test(t)?'close':null;
  return null;
}
function act(k){if(k==='stop')heardStop();else if(k==='A'||k==='B')pickUnit(k);else if(k==='send')send();else if(k==='close')closeReq()}
// interim: act early only when the step would succeed; final: act, or explain why nothing changed
function understand(raw,interim){
  var k=intent(norm(raw));
  if(k&&interim&&k==='close'&&S.flow>.5)k=null;
  if(k){act(k);$('miss').textContent=k==='close'&&S.flow>.5?$('miss').textContent:'';return true}
  if(!interim)$('miss').textContent=(S.stage===3||S.stage===4)?'Heard “'+raw.trim()+'”. The field is working now; nothing changed.':'Heard “'+raw.trim()+'”. '+({0:'Say “Stop P-1.”',1:'Say “Unit B” or “Unit A.”',2:'Say “Send.”',5:'Say “'+tag()+' reads zero, close.”'}[S.stage]||'Nothing changed.');
  return false;
}

/* ================= voice ================= */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition,rec=null,want=false,levelT=null,handled={},sess=0;
var PHRASES=['Stop P-1','P-1','Unit A','Unit B','Send','FI-101 reads zero, close','close'];
function startListen(){
  if(!SR){toast('Voice is not available in this browser. Type it, or use the buttons.');$('typ').focus();return}
  want=true;S.listening=true;showDock();
  try{rec=new SR();rec.lang='en-US';rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=5;
    // bias toward the words this demo uses, where the browser supports it
    try{if(window.SpeechRecognitionPhrase&&'phrases' in rec)rec.phrases=PHRASES.map(function(p){return new SpeechRecognitionPhrase(p,5)})}catch(_){}
    try{var G=window.SpeechGrammarList||window.webkitSpeechGrammarList;if(G){var g=new G();g.addFromString('#JSGF V1.0; grammar ops; public <c> = stop p one | unit a | unit b | send | zero | close ;',1);rec.grammars=g}}catch(_){}
    sess++;handled={};
    rec.onresult=function(e){for(var i=e.resultIndex;i<e.results.length;i++){var r=e.results[i],key=sess+':'+i,txt=r[0].transcript;
      $('said').textContent=txt.trim();
      if(handled[key])continue;
      var done=false;for(var k=0;k<r.length&&!done;k++)done=understand(r[k].transcript,!r.isFinal);
      if(done){handled[key]=true;$('said').textContent=txt.trim()}
      else if(r.isFinal)understand(txt,false)}};
    rec.onerror=function(e){if(e.error==='not-allowed'||e.error==='service-not-allowed'){want=false;stopListen();toast('Microphone blocked. Type it, or use the buttons.')}};
    rec.onend=function(){if(want&&S.listening){sess++;handled={};setTimeout(function(){if(want)try{rec.start()}catch(_){}},120)}else{S.listening=false;showDock()}};
    rec.start();
  }catch(err){want=false;S.listening=false;showDock();toast('Voice could not start. Type it, or use the buttons.')}
}
function stopListen(){want=false;S.listening=false;if(rec){try{rec.stop()}catch(_){}}showDock()}
function showDock(){$('dockIdle').hidden=S.listening;$('dockOn').hidden=!S.listening;
  if(S.listening&&!levelT)levelT=setInterval(function(){var b=$('lvl').children;for(var i=0;i<b.length;i++)b[i].style.height=(4+Math.random()*12)+'px'},120);
  if(!S.listening&&levelT){clearInterval(levelT);levelT=null}}
$('lvl').innerHTML=new Array(11).join('<i></i>');

/* ================= process value ================= */
function stepFlow(){
  if(S.stage>=5){S.flow=S.flow>1?S.flow*.4:0}else S.flow=119.6+(Math.random()-.5)*1.8;
  S.hist.push(S.flow);if(S.hist.length>24)S.hist.shift();
  var v=$('dcsVal');v.textContent=S.flow.toFixed(1);v.classList.toggle('zero',S.flow<.05);
  var l=$('sparkL');l.setAttribute('points',S.hist.map(function(y,i){return (i*4)+','+(30-y/125*24).toFixed(1)}).join(' '));l.setAttribute('stroke',S.flow<.05?'#3ddc84':'#f2d533');
  if(S.stage===5&&closer)closer.setDisabled(S.flow>.5,'Wait for '+tag()+' to read 0');
}
function tick(){var now=Date.now();
  [].forEach.call(document.querySelectorAll('[data-timer]'),function(el){var k=el.getAttribute('data-timer');if(S.t[k])el.textContent=mmss(now-S.t[k])});
  var c=hhmm();[].forEach.call(document.querySelectorAll('.clock'),function(el){el.textContent=c})}
setInterval(stepFlow,700);setInterval(tick,500);

var tT;function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(function(){t.classList.remove('on')},1900)}

/* ================= events ================= */
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.unit){pickUnit(b.dataset.unit);return}
  switch(b.id){
    case 'micBtn':startListen();break;
    case 'stopBtn':stopListen();break;
    case 'toHO':go(7);break;
    case 'again':case 'again2':reset();break;
    case 'camBtn':if(S.photo!=='done'){S.photo='done';render();toast('Tag photo is optional. Skipped in this demo.')}break;
    case 'hoBack':S.ho=false;if(S.stage===7)S.stage=6;render();break;
  }
});
$('typForm').addEventListener('submit',function(e){e.preventDefault();var v=$('typ').value.trim();if(!v)return;$('said').textContent=v;if(understand(v))$('typ').value=''});
window.addEventListener('resize',function(){segView.relayout();segCR.relayout();if(stack)stack.relayout()});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){segView.relayout();segCR.relayout();if(stack)stack.relayout()});

render();setView('cr');
window.__ops={get stage(){return S.stage},get flow(){return S.flow},say:function(t){return understand(t)}};
})();
</script>
